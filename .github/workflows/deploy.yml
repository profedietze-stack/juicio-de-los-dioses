name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Las ramas y los PR pasan por lint, tests, build y e2e antes de llegar a master (no se despliegan).
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Runner fijo: con ubuntu-latest (migrando a Ubuntu 26) `canvas` no encuentra su binario precompilado
# y `npm ci` intenta compilarlo y falla. Se sube de version a conciencia, no por sorpresa.
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # `canvas` (solo lo usan los tests) baja un binario precompilado; si esa descarga falla, reintenta.
      - run: npm ci || (sleep 15 && npm ci)
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Lo que vitest no puede probar: jugar una partida entera en un navegador real y que el
  # juego abra sin internet (service worker, sobre el build de produccion).
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Sin scripts de instalacion: el e2e no usa `canvas`, y asi no depende de la descarga de su binario.
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:offline
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-test-results
          path: test-results
          retention-days: 7

  # Vulnerabilidades conocidas en las dependencias. Va aparte y no frena el deploy: un aviso nuevo
  # en una herramienta de desarrollo no tiene que impedir publicar, pero tiene que verse en rojo.
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm audit --audit-level=moderate

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: [build, e2e]
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
